version: '3.8'

services:
  bd:
    image: mariadb:11.2
    container_name: archivum_db
    restart: always
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-archivum_db}
      MARIADB_USER: ${DB_USERNAME:-archivista}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secreto_seguro}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secreto}
      MYSQL_DATABASE: ${DB_DATABASE:-archivum_db}
      MYSQL_USER: ${DB_USERNAME:-archivista}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secreto_seguro}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secreto}
    volumes:
      - db_data:/var/lib/mysql
    # Cumple con el requisito: No utilizar root para bases de datos
    user: "999:999"
    networks:
      - archivum-net
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archivum_app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
      - app_vendor:/var/www/vendor
      - app_build:/var/www/public/build
    environment:
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=bd
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-archivum_db}
      - DB_USERNAME=${DB_USERNAME:-archivista}
      - DB_PASSWORD=${DB_PASSWORD:-secreto_seguro}
    # Cumple con el requisito: No utilizar root para los contenedores (asumiendo ID 1000 del usuario del Dockerfile)
    user: "1000:1000"
    command: >
      sh -c " [ ! -f .env ] && cp .env.example .env; php artisan key:generate --force; php artisan migrate --force; php artisan storage:link --force || true; php-fpm "
    depends_on:
      bd:
        condition: service_healthy
    networks:
      - archivum-net

  frontend:
    image: nginx:alpine
    container_name: archivum_nginx
    restart: always
    ports:
      - "8000:80"
      - "8080:80"
      - "8088:80"
    volumes:
      - .:/var/www
      - app_build:/var/www/public/build
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - archivum-net

volumes:
  db_data:
  app_vendor:
  app_build:

networks:
  archivum-net:
    driver: bridge
